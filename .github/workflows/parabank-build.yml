name: ParaBank Build Check (Tests Not Run)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parabank-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile Java and test sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select preinstalled Java 17
        shell: bash
        run: |
          test -x "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      - name: Compile application and test code
        shell: bash
        run: |
          java -version
          mvn --version
          mvn --batch-mode --no-transfer-progress clean test-compile

      - name: Record check scope
        shell: bash
        run: |
          echo '## Build check passed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Application and test sources compiled using Java 17.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No tests were executed. ParaBank and HSQLDB are not provisioned in this workflow.' >> "$GITHUB_STEP_SUMMARY"